<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<title>Двоечка — чат для двоих</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--text:#16202b;--muted:#6b7785;--me:#2f7cf6;--them:#fff;--accent:#2f7cf6;--line:#dfe4ea;--danger:#e5484d}
@media(prefers-color-scheme:dark){:root{--bg:#0e1621;--panel:#17212b;--text:#e8edf2;--muted:#8a97a5;--them:#1f2c3a;--line:#243241;--me:#2b6fd6;--accent:#3b82f6}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100dvh;max-width:760px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}

header{display:flex;align-items:center;gap:12px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.ava{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#6aa8ff,#7c5cff);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.hinfo{flex:1;min-width:0}
.htitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstatus{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#aaa;flex:none}
.dot.ok{background:#31c48d}.dot.wait{background:#f5a623}.dot.err{background:var(--danger)}
.ibtn{border:0;background:transparent;font-size:20px;width:40px;height:40px;border-radius:50%;cursor:pointer;color:var(--text)}
.ibtn:hover{background:var(--line)}

#menu{position:absolute;right:10px;top:62px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:6px;z-index:5;min-width:250px}
#menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:10px 12px;border-radius:8px;cursor:pointer;font-size:15px}
#menu button:hover{background:var(--bg)}

#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.msg{max-width:82%;padding:8px 12px 6px;border-radius:18px;word-break:break-word;animation:pop .15s ease-out}
.msg .txt{white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:var(--them);border-bottom-left-radius:5px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.msg.video{background:transparent;box-shadow:none;padding:0}
.msg.video .meta{color:var(--muted)}
.msg.sending{opacity:.6}
.meta{font-size:11px;opacity:.7;margin-top:2px;display:flex;justify-content:flex-end;gap:4px}
.tick.read{color:#9be7ff;opacity:1}
.sys{align-self:center;font-size:12.5px;color:var(--muted);background:var(--line);padding:3px 10px;border-radius:12px;margin:6px 0;text-align:center}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}

.voice{display:flex;align-items:center;gap:10px;min-width:210px}
.vbtn{width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;font-size:15px;flex:none;display:grid;place-items:center}
.me .vbtn{background:#fff;color:var(--me)}
.them .vbtn{background:var(--accent);color:#fff}
.wave{display:flex;align-items:center;gap:2px;height:30px;flex:1;cursor:pointer}
.wave i{display:block;width:3px;border-radius:2px;background:currentColor;opacity:.35}
.wave i.on{opacity:1}
.them .wave{color:var(--accent)}
.vtime{font-size:12px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}

.vnote{position:relative;width:210px;height:210px;border-radius:50%;overflow:hidden;background:#000;cursor:pointer}
.vnote video{width:100%;height:100%;object-fit:cover;display:block}
.vover{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:38px;background:rgba(0,0,0,.25)}
.vdur{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:1px 8px;border-radius:10px}

.invite{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:6px 0 10px}
.invite h3{margin:0 0 4px;font-size:16px}
.invite p{margin:0 0 10px;color:var(--muted);font-size:14px}
.invite .row{display:flex;gap:8px;flex-wrap:wrap}
.invite input{flex:1;min-width:160px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px}
.btn{border:0;background:var(--accent);color:#fff;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
.btn.sec{background:var(--line);color:var(--text)}

#phrases{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.tab{border:0;background:var(--bg);color:var(--text);padding:6px 12px;border-radius:14px;white-space:nowrap;cursor:pointer;font-size:14px}
.tab.on{background:var(--accent);color:#fff}
.grid{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow-y:auto}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:8px 12px;border-radius:16px;cursor:pointer;font-size:15px;display:inline-flex;gap:8px;align-items:center}
.chip:active{transform:scale(.96)}
.chip.add{border-style:dashed;color:var(--accent)}
.chip .x{opacity:.6;padding:0 2px}

footer{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#composer{display:flex;align-items:flex-end;gap:6px}
#input{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:20px;padding:10px 14px;font:inherit;max-height:120px;outline:none}
#input:focus{border-color:var(--accent)}
.round{width:42px;height:42px;border-radius:50%;border:0;font-size:20px;cursor:pointer;flex:none;background:transparent;color:var(--text)}
.round:hover{background:var(--line)}
.round.primary{background:var(--accent);color:#fff}
#app.offline #act,#app.offline #vid{opacity:.45}

#recbar{display:flex;align-items:center;gap:10px}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:blink 1s infinite;flex:none}
@keyframes blink{50%{opacity:.25}}
#prev{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#000;transform:scaleX(-1);flex:none}
#rectime{font-variant-numeric:tabular-nums;flex:1}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20;padding:20px}
.modal form{background:var(--panel);border-radius:18px;padding:22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.modal h2{margin:0}
.modal p{margin:0;color:var(--muted);font-size:14px}
.modal input{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:.95}
</style>
</head>
<body>
<div id="app" class="offline">
  <header>
    <div class="ava" id="ava">💬</div>
    <div class="hinfo">
      <div class="htitle" id="title">Двоечка</div>
      <div class="hstatus"><span class="dot" id="dot"></span><span id="status">запуск…</span></div>
    </div>
    <button class="ibtn" id="linkBtn" title="Скопировать ссылку-приглашение" hidden>🔗</button>
    <button class="ibtn" id="menuBtn" title="Меню">⋮</button>
  </header>

  <div id="menu" hidden>
    <button id="mCopy">🔗 Скопировать ссылку-приглашение</button>
    <button id="mName">✏️ Сменить моё имя</button>
    <button id="mClear">🧹 Очистить историю у меня</button>
    <button id="mNew">♻️ Новая ссылка (сбросить собеседника)</button>
    <button id="mHome">🏠 Создать свой чат</button>
  </div>

  <div id="chat"></div>

  <div id="phrases" hidden>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </div>

  <footer>
    <div id="composer">
      <button class="round" id="phBtn" title="Быстрые фразы">⚡</button>
      <textarea id="input" rows="1" placeholder="Сообщение" maxlength="4000"></textarea>
      <button class="round" id="vid" title="Видео-кружок">📹</button>
      <button class="round primary" id="act" title="Голосовое / отправить">🎤</button>
    </div>
    <div id="recbar" hidden>
      <span class="recdot"></span>
      <video id="prev" muted playsinline hidden></video>
      <span id="rectime">0:00</span>
      <button class="btn sec" id="recCancel">✕ Отмена</button>
      <button class="btn" id="recSend">➤ Отправить</button>
    </div>
  </footer>
</div>

<div class="modal" id="nameModal" hidden>
  <form id="nameForm">
    <h2>Как тебя зовут?</h2>
    <p>Это имя увидит твой собеседник.</p>
    <input id="nameInput" maxlength="24" placeholder="Имя" autocomplete="nickname" required>
    <button class="btn" type="submit">Продолжить</button>
  </form>
</div>
<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
'use strict';

/* ───────── утилиты ───────── */
const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const rid = n => {
  const a = 'abcdefghjkmnpqrstuvwxyz23456789';
  let s = '';
  for (const x of crypto.getRandomValues(new Uint8Array(n))) s += a[x % a.length];
  return s;
};
const uid = () => rid(10);
const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmtDur = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const timeStr = ts => new Date(ts).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
let toastTimer;
function toast(t) {
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch {
    const ta = mk('textarea'); ta.value = t; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); return ok;
  }
}

/* ───────── роли и состояние ───────── */
// Ссылка вида https://…/#ID — ID хозяина чата. Нет хэша (или он наш) → мы хозяин.
const hashId = decodeURIComponent(location.hash.slice(1)).trim();
const cid = LS.get('cid', null) || (() => { const c = 'c' + rid(12); LS.set('cid', c); return c; })();
let myName = LS.get('name', '');
const savedHostId = LS.get('hostId', null);
const isHost = !hashId || hashId === savedHostId;
const hostId = isHost ? (savedHostId || 'dv-' + rid(10)) : hashId;
const HIST = 'hist-' + hostId;
const FRIEND = 'friend-' + hostId;
let friendName = LS.get(FRIEND, '');

let peer = null, conn = null, busy = false;
let connTimer = null, restartTimer = null;

const ICE = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  // Публичный бесплатный TURN — запасной вариант, если прямое соединение не получилось.
  // Для надёжности можно заменить на свой (Metered, Cloudflare и т.п.).
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
] };

/* ───────── статус / шапка ───────── */
let base = { t: '', c: 'wait' }, typingUntil = 0, typingTimer;
function renderStatus() {
  const typing = Date.now() < typingUntil;
  $('#status').textContent = typing ? 'печатает…' : base.t;
  $('#dot').className = 'dot ' + (typing ? 'ok' : base.c);
}
function setStatus(t, c) { base = { t, c }; renderStatus(); }
function showTyping() {
  typingUntil = Date.now() + 3000; renderStatus();
  clearTimeout(typingTimer); typingTimer = setTimeout(renderStatus, 3100);
}
function updateHeader() {
  $('#title').textContent = friendName || (isHost ? 'Двоечка' : 'Чат');
  $('#ava').textContent = friendName ? friendName.trim().charAt(0).toUpperCase() : '💬';
}

/* ───────── сообщения ───────── */
const chat = $('#chat');
const els = new Map();
let curAudio = null, curVideo = null;
const scrollDown = () => { chat.scrollTop = chat.scrollHeight; };

function addSys(text) { chat.append(mk('div', 'sys', text)); scrollDown(); }

function voiceEl(m) {
  const url = URL.createObjectURL(m.blob);
  const a = new Audio(url); a.preload = 'metadata';
  const wrap = mk('div', 'voice');
  const btn = mk('button', 'vbtn', '▶');
  const wave = mk('div', 'wave');
  const lab = mk('span', 'vtime', fmtDur(m.dur));
  const N = 30, bars = [];
  let seed = (m.blob.size || 1) % 9973;
  for (let i = 0; i < N; i++) {
    seed = (seed * 9301 + 49297) % 233280;
    const b = document.createElement('i');
    b.style.height = (6 + Math.round(seed / 233280 * 22)) + 'px';
    wave.append(b); bars.push(b);
  }
  const paint = p => { const k = Math.floor(p * N); bars.forEach((b, i) => b.classList.toggle('on', i < k)); };
  btn.onclick = () => {
    if (a.paused) {
      if (curAudio && curAudio !== a) curAudio.pause();
      if (curVideo) curVideo.pause();
      curAudio = a; a.play().catch(() => toast('Не удалось воспроизвести'));
    } else a.pause();
  };
  a.onplay = () => { btn.textContent = '⏸'; };
  a.onpause = () => { btn.textContent = '▶'; };
  a.ontimeupdate = () => { paint(Math.min(1, a.currentTime / m.dur)); lab.textContent = fmtDur(a.currentTime); };
  a.onended = () => { btn.textContent = '▶'; paint(0); lab.textContent = fmtDur(m.dur); };
  a.onerror = () => { lab.textContent = '⚠'; };
  wave.onclick = e => {
    const r = wave.getBoundingClientRect();
    try { a.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * m.dur; } catch {}
  };
  wrap.append(btn, wave, lab);
  return wrap;
}

function videoEl(m) {
  const url = URL.createObjectURL(m.blob);
  const box = mk('div', 'vnote');
  const v = document.createElement('video');
  v.src = url + '#t=0.1'; v.playsInline = true; v.preload = 'metadata';
  const ov = mk('div', 'vover', '▶');
  const dur = mk('div', 'vdur', fmtDur(m.dur));
  box.append(v, ov, dur);
  box.onclick = () => {
    if (v.paused) {
      if (curVideo && curVideo !== v) curVideo.pause();
      if (curAudio) curAudio.pause();
      curVideo = v; v.play().catch(() => toast('Не удалось воспроизвести'));
    } else v.pause();
  };
  v.onplay = () => { ov.hidden = true; };
  v.onpause = () => { ov.hidden = false; };
  v.onended = () => { v.currentTime = 0; ov.hidden = false; };
  return box;
}

function addMsg(m) {
  const el = mk('div', 'msg ' + (m.from === 'me' ? 'me' : 'them') + (m.kind === 'video' ? ' video' : ''));
  if (m.kind === 'text') el.append(mk('div', 'txt', m.text));
  else if (m.kind === 'voice') el.append(voiceEl(m));
  else if (m.kind === 'video') el.append(videoEl(m));
  const meta = mk('div', 'meta');
  meta.append(mk('span', '', timeStr(m.ts)));
  if (m.from === 'me') { el.tick = mk('span', 'tick', '✓'); meta.append(el.tick); }
  el.append(meta);
  chat.append(el); els.set(m.id, el); scrollDown();
  return el;
}

function saveHist(m) {
  const arr = LS.get(HIST, []);
  arr.push({ id: m.id, from: m.from, text: m.text, ts: m.ts });
  LS.set(HIST, arr.slice(-300));
}
function loadHist() {
  for (const m of LS.get(HIST, [])) addMsg({ ...m, kind: 'text' });
}

/* ───────── приглашение ───────── */
const inviteLink = () => location.href.split('#')[0] + '#' + hostId;
function renderInvite() {
  $('#invite')?.remove();
  if (!isHost || LS.get('paired', null)) return;
  const card = mk('div', 'invite'); card.id = 'invite';
  card.append(mk('h3', '', '👋 Пригласи друга'));
  card.append(mk('p', '', 'Отправь ему эту ссылку — он просто откроет её и сразу попадёт к тебе в чат. Пока он заходит, не закрывай эту вкладку.'));
  const row = mk('div', 'row');
  const inp = mk('input'); inp.readOnly = true; inp.value = inviteLink();
  inp.onfocus = () => inp.select();
  const copy = mk('button', 'btn', 'Копировать');
  copy.onclick = async () => toast(await copyText(inviteLink()) ? 'Ссылка скопирована ✅' : 'Не удалось скопировать');
  row.append(inp, copy);
  if (navigator.share) {
    const sh = mk('button', 'btn sec', 'Поделиться');
    sh.onclick = () => navigator.share({ title: 'Двоечка', text: 'Заходи ко мне в чат!', url: inviteLink() }).catch(() => {});
    row.append(sh);
  }
  card.append(row);
  chat.prepend(card);
}

/* ───────── соединение ───────── */
const canSend = () => !!(conn && conn.open);
const safeSend = obj => { try { conn.send(obj); return true; } catch { return false; } };

function onConnected() {
  $('#app').classList.remove('offline');
  setStatus('в сети', 'ok');
  renderInvite(); updateHeader();
  addSys('Связь установлена 🟢');
}
function onDisconnected() {
  $('#app').classList.add('offline');
  setStatus(isHost ? 'друг не в сети' : 'нет связи, переподключаюсь…', 'wait');
  addSys('Связь потеряна');
}

function handle(c, d) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'busy') {
    busy = true; clearTimeout(connTimer);
    setStatus('чат занят другим собеседником', 'err');
    addSys('Эта ссылка уже занята. Попроси друга прислать новую или создай свой чат через меню.');
    return;
  }
  if (d.t === 'hello') {
    const nm = String(d.name || 'Друг').slice(0, 30);
    if (isHost) {
      const paired = LS.get('paired', null);
      if (paired && paired !== d.cid) {
        try { c.send({ t: 'busy' }); } catch {}
        setTimeout(() => { try { c.close(); } catch {} }, 500);
        return;
      }
      if (!paired) LS.set('paired', d.cid);
      const same = conn === c;
      if (conn && conn !== c) { const old = conn; conn = null; try { old.close(); } catch {} }
      conn = c; friendName = nm; LS.set(FRIEND, nm);
      try { c.send({ t: 'hello', name: myName, cid: 'host' }); } catch {}
      if (!same) onConnected(); else updateHeader();
    } else {
      friendName = nm; LS.set(FRIEND, nm); updateHeader();
    }
    return;
  }
  if (c !== conn) return;
  switch (d.t) {
    case 'text': {
      const m = { id: d.id, from: 'them', kind: 'text', text: String(d.text || '').slice(0, 4000), ts: d.ts || Date.now() };
      addMsg(m); saveHist(m); safeSend({ t: 'ack', id: d.id }); incoming(); break;
    }
    case 'voice': case 'video': {
      const blob = new Blob([d.buf], { type: d.mime || (d.t === 'video' ? 'video/webm' : 'audio/webm') });
      addMsg({ id: d.id, from: 'them', kind: d.t, blob, dur: +d.dur || 1, ts: d.ts || Date.now() });
      safeSend({ t: 'ack', id: d.id }); incoming(); break;
    }
    case 'ack': {
      const el = els.get(d.id);
      if (el && el.tick) { el.tick.textContent = '✓✓'; el.tick.classList.add('read'); }
      break;
    }
    case 'typing': showTyping(); break;
  }
}

function onIncoming(c) {           // только хозяин
  c.on('data', d => handle(c, d));
  c.on('close', () => { if (conn === c) { conn = null; onDisconnected(); } });
  c.on('error', () => {});
  setTimeout(() => { if (conn !== c) { try { c.close(); } catch {} } }, 10000);
}

function scheduleConnect(ms) { clearTimeout(connTimer); connTimer = setTimeout(connectToHost, ms); }
function connectToHost() {         // только гость
  if (busy || !peer || peer.destroyed || (conn && conn.open)) return;
  setStatus('подключаюсь к другу…', 'wait');
  const c = peer.connect(hostId, { reliable: true });
  let opened = false;
  const to = setTimeout(() => { if (!opened) { try { c.close(); } catch {} scheduleConnect(3000); } }, 12000);
  c.on('open', () => {
    opened = true; clearTimeout(to); conn = c;
    safeSend({ t: 'hello', name: myName, cid });
    onConnected();
  });
  c.on('data', d => handle(c, d));
  c.on('close', () => {
    clearTimeout(to);
    if (conn === c) { conn = null; onDisconnected(); }
    if (!busy) scheduleConnect(2500);
  });
  c.on('error', () => {});
}

function scheduleRestart(ms) {
  if (restartTimer) return;
  try { peer && peer.destroy(); } catch {}
  restartTimer = setTimeout(() => { restartTimer = null; startPeer(); }, ms);
}

function startPeer() {
  if (typeof Peer === 'undefined') { setStatus('не загрузилась библиотека PeerJS (нет интернета?)', 'err'); return; }
  setStatus('подключаюсь к серверу…', 'wait');
  peer = new Peer(isHost ? hostId : undefined, { debug: 0, config: ICE });
  peer.on('open', () => {
    if (isHost) {
      LS.set('hostId', hostId);
      renderInvite();
      if (!canSend()) setStatus(LS.get('paired', null) ? 'друг не в сети' : 'ждём друга', 'wait');
    } else connectToHost();
  });
  peer.on('connection', onIncoming);
  peer.on('disconnected', () => { if (!peer.destroyed) { try { peer.reconnect(); } catch {} } });
  peer.on('error', err => {
    switch (err.type) {
      case 'unavailable-id':
        setStatus('ссылка открыта в другой вкладке — закрой её', 'err'); scheduleRestart(5000); break;
      case 'peer-unavailable':
        setStatus('друг не в сети — жду…', 'wait'); scheduleConnect(4000); break;
      case 'network': case 'server-error': case 'socket-error': case 'socket-closed':
        setStatus('нет связи с сервером, повтор…', 'err'); scheduleRestart(4000); break;
      case 'webrtc':
        setStatus('ошибка соединения, повтор…', 'err'); if (!isHost) scheduleConnect(4000); break;
      default:
        toast('Ошибка: ' + err.type);
    }
  });
}

/* ───────── отправка ───────── */
function sendText(text) {
  text = text.trim(); if (!text) return false;
  if (!canSend()) { toast('Сейчас нет связи с другом'); return false; }
  const m = { id: uid(), from: 'me', kind: 'text', text, ts: Date.now() };
  if (!safeSend({ t: 'text', id: m.id, text, ts: m.ts })) { toast('Не отправилось'); return false; }
  addMsg(m); saveHist(m); return true;
}

async function sendMedia(kind, blob, dur) {
  if (!canSend()) { toast('Связь пропала — запись не отправлена'); return; }
  const m = { id: uid(), from: 'me', kind, blob, dur, ts: Date.now() };
  const el = addMsg(m); el.classList.add('sending');
  try {
    const buf = await blob.arrayBuffer();
    conn.send({ t: kind, id: m.id, mime: blob.type, dur, buf, ts: m.ts });
    el.classList.remove('sending');
  } catch { toast('Не удалось отправить'); }
}

let lastTyping = 0;
function sendTyping() {
  if (!canSend() || Date.now() - lastTyping < 2500) return;
  lastTyping = Date.now(); safeSend({ t: 'typing' });
}

/* ───────── уведомления ───────── */
let actx, unread = 0;
const baseTitle = document.title;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1175, t + .08);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.15, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .25);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .26);
  } catch {}
}
function incoming() {
  beep();
  if (document.hidden) { unread++; document.title = '(' + unread + ') ' + (friendName || 'Новое сообщение'); }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { unread = 0; document.title = baseTitle; } });

/* ───────── запись голоса и видео ───────── */
let rec = null;
function pickMime(kind) {
  const list = kind === 'video'
    ? ['video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9,opus', 'video/webm', 'video/mp4']
    : ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  return list.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}
function showRec(on, kind) {
  $('#composer').hidden = on; $('#recbar').hidden = !on;
  $('#prev').hidden = !(on && kind === 'video');
  if (on) $('#phrases').hidden = true;
}
async function startRec(kind) {
  if (rec) return;
  if (!canSend()) { toast('Сначала дождись подключения друга'); return; }
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { toast('Браузер не поддерживает запись (нужен HTTPS)'); return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia(kind === 'video'
      ? { audio: true, video: { facingMode: 'user', width: { ideal: 360 }, height: { ideal: 360 }, frameRate: { ideal: 24 } } }
      : { audio: true });
  } catch { toast(kind === 'video' ? 'Нет доступа к камере или микрофону' : 'Нет доступа к микрофону'); return; }
  const mime = pickMime(kind), opts = {};
  if (mime) opts.mimeType = mime;
  if (kind === 'video') { opts.videoBitsPerSecond = 450000; opts.audioBitsPerSecond = 48000; } else opts.audioBitsPerSecond = 32000;
  let mr; try { mr = new MediaRecorder(stream, opts); } catch { mr = new MediaRecorder(stream); }
  const r = { kind, mr, stream, chunks: [], t0: Date.now(), send: false, max: kind === 'video' ? 30 : 180, timer: null };
  rec = r;
  mr.ondataavailable = e => { if (e.data && e.data.size) r.chunks.push(e.data); };
  mr.onstop = () => finishRec(r, mime);
  if (kind === 'video') { const pv = $('#prev'); pv.srcObject = stream; pv.play().catch(() => {}); }
  showRec(true, kind);
  $('#rectime').textContent = '0:00 / ' + fmtDur(r.max);
  r.timer = setInterval(() => {
    const s = (Date.now() - r.t0) / 1000;
    $('#rectime').textContent = fmtDur(s) + ' / ' + fmtDur(r.max);
    if (s >= r.max) stopRec(true);
  }, 200);
  mr.start(250);
}
function stopRec(send) {
  if (!rec) return;
  rec.send = send;
  if (rec.mr.state !== 'inactive') rec.mr.stop(); else finishRec(rec, '');
}
function finishRec(r, mime) {
  clearInterval(r.timer);
  r.stream.getTracks().forEach(t => t.stop());
  $('#prev').srcObject = null;
  showRec(false);
  const dur = (Date.now() - r.t0) / 1000;
  if (rec === r) rec = null;
  if (!r.send) return;
  if (dur < 0.7 || !r.chunks.length) { toast('Слишком коротко'); return; }
  sendMedia(r.kind, new Blob(r.chunks, { type: r.mr.mimeType || mime || (r.kind === 'video' ? 'video/webm' : 'audio/webm') }), dur);
}

/* ───────── быстрые фразы ───────── */
const PHRASES = [
  ['👋 Привет', ['Привет!', 'Алло?', 'Алло, ты тут?', 'Здравствуй!', 'Доброе утро ☀️', 'Добрый вечер 🌆', 'Как дела?', 'Что нового?', 'Давно не виделись!']],
  ['✅ Ответы', ['Да', 'Нет', 'Может быть', 'Окей 👌', 'Конечно!', 'Не знаю', 'Понял', 'Согласен', 'Подожди минутку', 'Я скоро буду', 'Не могу говорить', 'Напиши позже']],
  ['😊 Эмоции', ['😂', '❤️', '👍', '🔥', '😢', '🙏', '😮', '🤝', 'Ура! 🎉', 'Круто!', 'Спасибо!', 'Извини']],
  ['🚪 Пока', ['Пока!', 'До встречи!', 'Увидимся', 'Спокойной ночи 🌙', 'Хорошего дня!', 'Береги себя', 'Я побежал(а)']]
];
let phTab = 0;
const myPhrases = () => LS.get('myphrases', []);
function renderPhrases() {
  const tabs = $('#tabs'), grid = $('#grid');
  tabs.textContent = ''; grid.textContent = '';
  const names = [...PHRASES.map(p => p[0]), '⭐ Мои'];
  names.forEach((n, i) => {
    const b = mk('button', 'tab' + (i === phTab ? ' on' : ''), n);
    b.onclick = () => { phTab = i; renderPhrases(); };
    tabs.append(b);
  });
  const send = t => { if (sendText(t)) $('#phrases').hidden = true; };
  if (phTab < PHRASES.length) {
    PHRASES[phTab][1].forEach(t => { const c = mk('button', 'chip', t); c.onclick = () => send(t); grid.append(c); });
  } else {
    myPhrases().forEach((t, i) => {
      const c = mk('button', 'chip'); c.append(mk('span', '', t));
      const x = mk('span', 'x', '✕');
      x.onclick = e => { e.stopPropagation(); const a = myPhrases(); a.splice(i, 1); LS.set('myphrases', a); renderPhrases(); };
      c.append(x); c.onclick = () => send(t); grid.append(c);
    });
    const add = mk('button', 'chip add', '＋ Добавить фразу');
    add.onclick = () => {
      const t = (prompt('Твоя быстрая фраза:') || '').trim();
      if (t) { const a = myPhrases(); a.push(t.slice(0, 200)); LS.set('myphrases', a); renderPhrases(); }
    };
    grid.append(add);
  }
}

/* ───────── интерфейс ───────── */
const input = $('#input'), act = $('#act');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  act.textContent = input.value.trim() ? '➤' : '🎤';
  if (input.value.trim()) sendTyping();
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); doSend(); }
});
function doSend() {
  if (sendText(input.value)) { input.value = ''; input.style.height = 'auto'; act.textContent = '🎤'; }
}
act.onclick = () => { if (input.value.trim()) doSend(); else startRec('voice'); };
$('#vid').onclick = () => startRec('video');
$('#recCancel').onclick = () => stopRec(false);
$('#recSend').onclick = () => stopRec(true);
$('#phBtn').onclick = () => { const p = $('#phrases'); p.hidden = !p.hidden; if (!p.hidden) renderPhrases(); };

const menu = $('#menu');
$('#menuBtn').onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; };
document.addEventListener('click', () => { menu.hidden = true; });
const copyInvite = async () => toast(await copyText(inviteLink()) ? 'Ссылка скопирована ✅' : 'Не удалось скопировать');
$('#linkBtn').onclick = copyInvite;
$('#mCopy').onclick = copyInvite;
$('#mName').onclick = () => {
  const n = (prompt('Новое имя:', myName) || '').trim().slice(0, 24);
  if (!n) return;
  myName = n; LS.set('name', n);
  safeSend({ t: 'hello', name: n, cid });
  toast('Имя изменено');
};
$('#mClear').onclick = () => {
  LS.del(HIST);
  chat.querySelectorAll('.msg,.sys').forEach(e => e.remove()); els.clear();
};
$('#mNew').onclick = () => {
  if (!confirm('Создать новую ссылку? Старая перестанет работать, история и собеседник будут сброшены.')) return;
  ['hostId', 'paired'].forEach(LS.del); LS.del(HIST); LS.del(FRIEND);
  try { peer && peer.destroy(); } catch {}
  location.hash = ''; location.reload();
};
$('#mHome').onclick = () => { location.href = location.href.split('#')[0]; };
if (isHost) $('#mHome').hidden = true; else { $('#mNew').hidden = true; $('#mCopy').hidden = true; }
if (isHost) $('#linkBtn').hidden = false;

window.addEventListener('pagehide', () => { try { peer && peer.destroy(); } catch {} });

/* ───────── запуск ───────── */
function boot() {
  if (!isHost && !/^[A-Za-z0-9_-]{3,64}$/.test(hostId)) {
    setStatus('неверная ссылка-приглашение', 'err');
    addSys('Ссылка повреждена. Попроси друга прислать её ещё раз.');
    return;
  }
  updateHeader(); loadHist(); renderInvite();
  if (location.protocol === 'file:') addSys('⚠ Файл открыт локально. Чтобы друг мог зайти по ссылке, опубликуй чат на GitHub Pages.');
  startPeer();
}
if (myName) boot();
else {
  $('#nameModal').hidden = false; $('#nameInput').focus();
  $('#nameForm').onsubmit = e => {
    e.preventDefault();
    myName = $('#nameInput').value.trim().slice(0, 24); if (!myName) return;
    LS.set('name', myName); $('#nameModal').hidden = true; boot();
  };
}
})();
</script>
